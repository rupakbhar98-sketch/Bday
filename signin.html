<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | MASTER HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="animated-bg" aria-hidden="true"></div>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p>Sign in to continue to MASTER HUB.</p>

      <form class="auth-form" novalidate>
        <div class="input-group">
          <input type="text" id="email" required placeholder=" " />
          <label for="email">Username or Email</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required placeholder=" " />
          <label for="password">Password</label>
        </div>

        <button type="submit" class="primary-btn">Sign In</button>
      </form>

      <div class="auth-links">
        <a href="index.html">← Back to Home</a>
        <a href="signup.html">Create account</a>
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
